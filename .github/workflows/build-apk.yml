name: 🔷 Generar APK - Noelu Ventas

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # ejecución manual

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 📦 Como ya tienes un package.json en tu repo, solo instalamos lo que dice ahí
      # y agregamos la herramienta de íconos.
      - name: 📦 Instalar dependencias
        run: |
          npm install
          npm install @capacitor/assets

      # 🛠️ Inicializamos la configuración usando tu carpeta 'www' y creamos la plataforma Android
      - name: 🛠️ Inicializar Capacitor y agregar Android
        run: |
          npx cap init "Noelu Ventas" "com.noelu.ventas" --web-dir=www
          npx cap add android

      # 🎨 Generamos los íconos (leerá automáticamente de tu carpeta 'assets')
      - name: 🎨 Generar íconos de la app
        run: npx @capacitor/assets generate --iconBackgroundColor '#e8ddf2' --iconBackgroundColorDark '#4a4458'

      # 📂 Inyectamos tu código de la carpeta www hacia la app de Android
      - name: 📂 Sincronizar archivos web
        run: npx cap sync android

      # 🔨 Compilamos el APK
      - name: 🔨 Construir APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 📦 Guardamos el APK generado
      - name: 📦 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NoeluVentas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
