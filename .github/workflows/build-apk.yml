name: 🔷 Generar APK - Noelu Ventas

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite ejecutarlo manualmente desde Actions

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: 🛠️ Crear proyecto Capacitor y agregar Android
        run: |
          npx cap init "Noelu Ventas" "com.noelu.ventas" --web-dir=www
          npx cap add android

      - name: 📂 Sincronizar archivos web
        run: npx cap sync android

      - name: 🔨 Construir APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📦 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NoeluVentas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
